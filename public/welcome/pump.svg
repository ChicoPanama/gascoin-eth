<?xml version="1.0" encoding="UTF-8"?>
<!--
  GASCOIN interactive pump — v4.

  Blend: the v2 pump's rich detail (rivets, panel lines, brand plate,
  serial strip, status LED, rim lighting, gradients) + v3's tighter,
  near-square proportions that match the user's reference image more
  closely. viewBox 1000x1100.

  Interactive groups:
    #pump-handle   top cap with DOCS stamp
    #pump-display  central screen (the door → /submit)
    #pump-body     main rounded body (rivets, panel lines, brand plate,
                   serial strip, pulsing status LED)
    #pump-nozzle   compact hose + grip hanging close to the body
    #pump-base     thin slab with rivets and STATION · 01 text
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 1100"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-label="GASCOIN gas pump"
>
  <defs>
    <linearGradient id="body-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#1c1c1f"/>
      <stop offset="0.08" stop-color="#141417"/>
      <stop offset="0.5"  stop-color="#0a0a0b"/>
      <stop offset="1"    stop-color="#030304"/>
    </linearGradient>

    <linearGradient id="rim-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="rgba(231,233,234,0.22)"/>
      <stop offset="0.1"  stop-color="rgba(231,233,234,0.02)"/>
      <stop offset="1"    stop-color="transparent"/>
    </linearGradient>

    <linearGradient id="screen-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#f7f8f4"/>
      <stop offset="0.5"  stop-color="#eaeae4"/>
      <stop offset="1"    stop-color="#d4d6d0"/>
    </linearGradient>

    <linearGradient id="nozzle-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#1e1e21"/>
    </linearGradient>

    <radialGradient id="halo-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="rgba(231,233,234,0.14)"/>
      <stop offset="0.5" stop-color="rgba(231,233,234,0.04)"/>
      <stop offset="1"   stop-color="rgba(231,233,234,0)"/>
    </radialGradient>

    <!-- LCD grid pattern for the display -->
    <pattern id="lcd-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
    </pattern>

    <!-- Scanline overlay (2px repeating lines) -->
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="4" fill="transparent"/>
      <line x1="0" y1="2" x2="4" y2="2" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    </pattern>

    <!-- Panel hatch for texture on lower body + base -->
    <pattern id="panel-hatch" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(231,233,234,0.018)" stroke-width="1"/>
    </pattern>

    <!-- Soft-blur for the ground shadow -->
    <filter id="soft-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ═══ GROUND SHADOW ═══════════════════════════════════════════════ -->
  <g id="pump-ground">
    <ellipse cx="500" cy="1020" rx="360" ry="18"
             fill="rgba(231,233,234,0.08)" filter="url(#soft-blur)"/>
    <ellipse cx="500" cy="1020" rx="260" ry="10"
             fill="rgba(231,233,234,0.14)"/>
  </g>

  <!-- ═══ HALO ═══════════════════════════════════════════════════════ -->
  <ellipse id="pump-halo" cx="500" cy="560" rx="480" ry="540"
           fill="url(#halo-grad)" opacity="0.6"/>

  <!-- ═══ BASE (thin slab, richer than v3) ═══════════════════════════ -->
  <g id="pump-base" class="pump-region" tabindex="0">
    <!-- Upper lip where body meets base -->
    <rect x="188" y="868" width="624" height="14" rx="2"
          fill="#0a0a0b" stroke="#2F3336" stroke-width="1"/>
    <!-- Main base slab -->
    <rect x="170" y="880" width="660" height="110" rx="4"
          fill="url(#body-grad)" stroke="#2F3336" stroke-width="2"/>
    <!-- Rim light on the top edge -->
    <rect x="172" y="880" width="656" height="20" rx="4" fill="url(#rim-light)"/>
    <!-- Panel hatch for texture -->
    <rect x="170" y="880" width="660" height="110" rx="4" fill="url(#panel-hatch)"/>
    <!-- STATION · 01 plate -->
    <rect x="410" y="912" width="180" height="26" rx="2"
          fill="none" stroke="rgba(231,233,234,0.18)" stroke-width="1"/>
    <text x="500" y="930" text-anchor="middle"
          fill="rgba(231,233,234,0.38)"
          font-family="ui-monospace, 'IBM Plex Mono', monospace"
          font-size="13" letter-spacing="4">STATION · 01</text>
    <!-- Bottom step detail -->
    <rect x="200" y="960" width="600" height="24" rx="2"
          fill="#030304" stroke="#1a1a1d" stroke-width="1"/>
    <!-- Corner rivets -->
    <circle cx="192" cy="898" r="3" fill="#1a1a1d" stroke="#2F3336" stroke-width="0.6"/>
    <circle cx="808" cy="898" r="3" fill="#1a1a1d" stroke="#2F3336" stroke-width="0.6"/>
    <circle cx="192" cy="974" r="3" fill="#1a1a1d" stroke="#2F3336" stroke-width="0.6"/>
    <circle cx="808" cy="974" r="3" fill="#1a1a1d" stroke="#2F3336" stroke-width="0.6"/>
  </g>

  <!-- ═══ MAIN BODY (rounded rectangle, near-square) ═════════════════ -->
  <g id="pump-body" class="pump-region" tabindex="0">
    <!-- Main body slab — 560 × 660, nearly square instead of v2's tall -->
    <rect x="200" y="230" width="560" height="660" rx="28"
          fill="url(#body-grad)" stroke="#2F3336" stroke-width="2.5"/>
    <!-- Rim-light highlight on the top curve -->
    <rect x="202" y="232" width="556" height="84" rx="28" fill="url(#rim-light)"/>
    <!-- Subtle panel hatch for texture on the lower body -->
    <rect x="200" y="600" width="560" height="290" rx="0" fill="url(#panel-hatch)"/>

    <!-- Horizontal panel-line dividers (tightened spacing vs v2) -->
    <line x1="220" y1="640" x2="740" y2="640" stroke="#2F3336" stroke-width="1"/>
    <line x1="220" y1="750" x2="740" y2="750" stroke="#2F3336" stroke-width="1"/>
    <line x1="220" y1="840" x2="740" y2="840" stroke="#2F3336" stroke-width="1"/>

    <!-- Side rivets — 3 pairs -->
    <circle cx="214" cy="660" r="3.5" fill="#1a1a1d" stroke="#2F3336" stroke-width="0.6"/>
    <circle cx="746" cy="660" r="3.5" fill="#1a1a1d" stroke="#2F3336" stroke-width="0.6"/>
    <circle cx="214" cy="770" r="3.5" fill="#1a1a1d" stroke="#2F3336" stroke-width="0.6"/>
    <circle cx="746" cy="770" r="3.5" fill="#1a1a1d" stroke="#2F3336" stroke-width="0.6"/>
    <circle cx="214" cy="860" r="3.5" fill="#1a1a1d" stroke="#2F3336" stroke-width="0.6"/>
    <circle cx="746" cy="860" r="3.5" fill="#1a1a1d" stroke="#2F3336" stroke-width="0.6"/>

    <!-- Brand mark plate in the middle of the body -->
    <rect x="340" y="668" width="280" height="58" rx="4"
          fill="none" stroke="rgba(231,233,234,0.2)" stroke-width="1"/>
    <text x="480" y="706" text-anchor="middle"
          fill="rgba(231,233,234,0.6)"
          font-family="ui-monospace, 'IBM Plex Mono', monospace"
          font-weight="700" font-size="26" letter-spacing="6">GASCOIN</text>

    <!-- Serial number strip -->
    <rect x="380" y="762" width="200" height="22" rx="2"
          fill="#030304" stroke="#1a1a1d" stroke-width="1"/>
    <text x="480" y="778" text-anchor="middle"
          fill="rgba(231,233,234,0.32)"
          font-family="ui-monospace, 'IBM Plex Mono', monospace"
          font-size="11" letter-spacing="2">SN · 0x2ykSTA · PANAMA</text>

    <!-- Pulsing status LED -->
    <circle cx="480" cy="812" r="5" fill="#E7E9EA">
      <animate attributeName="opacity"
               values="0.4;1;0.4"
               dur="2.2s"
               repeatCount="indefinite"/>
    </circle>

    <!-- Reflection highlight strip on the left edge -->
    <rect x="200" y="300" width="3" height="560" fill="rgba(231,233,234,0.06)"/>
  </g>

  <!-- ═══ DISPLAY SCREEN ═════════════════════════════════════════════ -->
  <g id="pump-display" class="pump-region" tabindex="0">
    <!-- Bezel (black frame) -->
    <rect x="252" y="290" width="456" height="284" rx="12"
          fill="#000" stroke="#2F3336" stroke-width="2"/>
    <!-- Inner display face -->
    <rect x="264" y="302" width="432" height="260" rx="6"
          fill="url(#screen-grad)"/>
    <!-- LCD subpixel grid -->
    <rect x="264" y="302" width="432" height="260" rx="6"
          fill="url(#lcd-grid)"/>
    <!-- Scanline overlay -->
    <rect x="264" y="302" width="432" height="260" rx="6"
          fill="url(#scanlines)"/>

    <!-- [G] logo square on the left -->
    <g transform="translate(296, 340)">
      <rect x="0" y="0" width="96" height="96" rx="8" fill="#0a0a0b"/>
      <text x="48" y="76" text-anchor="middle"
            fill="#f7f8f4"
            font-family="ui-monospace, 'IBM Plex Mono', monospace"
            font-weight="800" font-size="78">G</text>
      <rect x="0" y="0" width="96" height="96" rx="8" fill="url(#lcd-grid)"/>
    </g>

    <!-- "ASCOIN" wordmark to the right of the [G] -->
    <text x="406" y="412"
          fill="#0a0a0b"
          font-family="ui-monospace, 'IBM Plex Mono', monospace"
          font-weight="800" font-size="62" letter-spacing="2">ASCOIN</text>

    <!-- "Gas. Paid Back..." tagline bottom-right -->
    <text x="684" y="532" text-anchor="end"
          fill="#2a2a2d"
          font-family="ui-monospace, 'IBM Plex Mono', monospace"
          font-size="16" font-style="italic" letter-spacing="1">Gas. Paid Back...</text>

    <!-- On-screen indicator LEDs -->
    <circle cx="276" cy="548" r="2.5" fill="rgba(0,0,0,0.55)"/>
    <circle cx="288" cy="548" r="2.5" fill="rgba(0,0,0,0.28)"/>
    <circle cx="300" cy="548" r="2.5" fill="rgba(0,0,0,0.28)"/>

    <!-- Alt "> ENTER_" hover prompt (hidden by default) -->
    <g id="pump-display-hover-prompt" opacity="0">
      <rect x="264" y="302" width="432" height="260" rx="6" fill="#f7f8f4"/>
      <rect x="264" y="302" width="432" height="260" rx="6" fill="url(#lcd-grid)"/>
      <rect x="264" y="302" width="432" height="260" rx="6" fill="url(#scanlines)"/>
      <text x="286" y="380"
            fill="#0a0a0b"
            font-family="ui-monospace, 'IBM Plex Mono', monospace"
            font-weight="800" font-size="30" letter-spacing="2">&gt; BOOT</text>
      <text x="286" y="422"
            fill="#0a0a0b"
            font-family="ui-monospace, 'IBM Plex Mono', monospace"
            font-size="22" letter-spacing="1">GASCOIN PROTOCOL</text>
      <text x="286" y="458"
            fill="#0a0a0b"
            font-family="ui-monospace, 'IBM Plex Mono', monospace"
            font-size="16" letter-spacing="1">SEASON 1 · INVITE REQ</text>
      <text x="286" y="528"
            fill="#0a0a0b"
            font-family="ui-monospace, 'IBM Plex Mono', monospace"
            font-weight="800" font-size="32" letter-spacing="3">&gt; ENTER_</text>
      <rect id="pump-display-cursor"
            x="498" y="500" width="14" height="30"
            fill="#0a0a0b"/>
    </g>
  </g>

  <!-- ═══ TOP HANDLE (with DOCS stamp) ═══════════════════════════════ -->
  <g id="pump-handle" class="pump-region" tabindex="0">
    <rect x="356" y="188" width="288" height="48" rx="8"
          fill="url(#body-grad)" stroke="#2F3336" stroke-width="2"/>
    <rect x="358" y="190" width="284" height="16" rx="8" fill="url(#rim-light)"/>
    <!-- Grip lines -->
    <line x1="380" y1="214" x2="620" y2="214" stroke="rgba(231,233,234,0.08)" stroke-width="1"/>
    <line x1="380" y1="222" x2="620" y2="222" stroke="rgba(231,233,234,0.08)" stroke-width="1"/>
    <!-- DOCS stamp -->
    <text x="500" y="232" text-anchor="middle"
          fill="rgba(231,233,234,0.32)"
          font-family="ui-monospace, 'IBM Plex Mono', monospace"
          font-size="10" letter-spacing="3">DOCS</text>
  </g>

  <!-- ═══ NOZZLE (compact, hangs close to the body) ══════════════════ -->
  <g id="pump-nozzle" class="pump-region" tabindex="0">
    <!-- Connector on body right side -->
    <rect x="756" y="380" width="22" height="28" rx="3"
          fill="#1a1a1d" stroke="#2F3336" stroke-width="1.5"/>

    <!-- Hose (outer + inner for 3D feel) -->
    <path d="M 778 394
             C 830 394, 856 430, 856 490
             C 856 540, 844 560, 820 560"
          stroke="#2F3336" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 778 394
             C 830 394, 856 430, 856 490
             C 856 540, 844 560, 820 560"
          stroke="#0a0a0b" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Nozzle grip -->
    <g transform="translate(756, 548)">
      <rect x="28" y="0" width="28" height="18" rx="2"
            fill="#1a1a1d" stroke="#2F3336" stroke-width="1"/>
      <rect x="0" y="16" width="84" height="96" rx="8"
            fill="url(#nozzle-grad)" stroke="#2F3336" stroke-width="2"/>
      <rect x="2" y="18" width="80" height="16" rx="8" fill="url(#rim-light)"/>
      <!-- Grip lines -->
      <line x1="10" y1="48" x2="74" y2="48" stroke="rgba(231,233,234,0.08)" stroke-width="1"/>
      <line x1="10" y1="58" x2="74" y2="58" stroke="rgba(231,233,234,0.08)" stroke-width="1"/>
      <!-- Trigger guard -->
      <path d="M 10 70
               Q -10 80, -10 98
               Q -10 116, 14 116
               L 38 116"
            fill="none" stroke="#2F3336" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="12" y="82" width="20" height="10" rx="2"
            fill="#0a0a0b" stroke="#2F3336" stroke-width="0.8"/>
      <!-- Spout -->
      <rect x="30" y="112" width="22" height="42" rx="1"
            fill="#1a1a1d" stroke="#2F3336" stroke-width="1"/>
      <rect x="28" y="150" width="26" height="8" rx="1" fill="#0a0a0b"/>
      <rect x="32" y="156" width="18" height="4" fill="#000"/>

      <!-- Animated drip -->
      <circle id="pump-nozzle-drip"
              cx="41" cy="166" r="4"
              fill="rgba(231,233,234,0.9)"
              opacity="0"/>
    </g>
  </g>
</svg>
