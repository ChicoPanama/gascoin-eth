<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" fill="none">
  <rect width="1200" height="700" fill="#0B0D12"/>
  <text x="60" y="70" fill="#EAF2FF" font-family="Inter, Arial" font-size="36" font-weight="700">GASCOIN AI System Overview</text>
  <text x="60" y="105" fill="#9FB3D9" font-family="Inter, Arial" font-size="18">Submission lifecycle from intake to payout</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6EA8FE"/>
    </marker>
  </defs>

  <g font-family="Inter, Arial" font-size="16" fill="#EAF2FF">
    <rect x="60" y="170" width="210" height="90" rx="12" fill="#132238" stroke="#2A4A73"/>
    <text x="86" y="208">User Submission</text><text x="86" y="234" fill="#A8C1E8">Wallet + Tweet + Receipt</text>

    <rect x="330" y="170" width="210" height="90" rx="12" fill="#132238" stroke="#2A4A73"/>
    <text x="355" y="208">Signal Extraction</text><text x="355" y="234" fill="#A8C1E8">X API + OCR + Metadata</text>

    <rect x="600" y="170" width="210" height="90" rx="12" fill="#132238" stroke="#2A4A73"/>
    <text x="627" y="208">AI Scoring</text><text x="627" y="234" fill="#A8C1E8">Fraud/Tamper/Quality</text>

    <rect x="870" y="170" width="250" height="90" rx="12" fill="#132238" stroke="#2A4A73"/>
    <text x="898" y="208">Gate Decision Engine</text><text x="898" y="234" fill="#A8C1E8">Sequential 1 → 10</text>

    <rect x="870" y="330" width="250" height="90" rx="12" fill="#133126" stroke="#2F7A58"/>
    <text x="930" y="368">Approved</text><text x="915" y="394" fill="#AEE8C5">Queue for payout</text>

    <rect x="870" y="500" width="250" height="90" rx="12" fill="#3A2626" stroke="#9E5252"/>
    <text x="940" y="538">Failed</text><text x="903" y="564" fill="#F4B3B3">Reason + remediation</text>

    <rect x="540" y="330" width="250" height="90" rx="12" fill="#2A2D12" stroke="#7A7A2F"/>
    <text x="600" y="368">Gate 10 Queue</text><text x="564" y="394" fill="#E4E4A8">Auto-retry every 6h</text>

    <rect x="540" y="500" width="250" height="90" rx="12" fill="#132238" stroke="#2A4A73"/>
    <text x="594" y="538">Audit Log</text><text x="568" y="564" fill="#A8C1E8">All transitions recorded</text>
  </g>

  <line x1="270" y1="215" x2="330" y2="215" stroke="#6EA8FE" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="540" y1="215" x2="600" y2="215" stroke="#6EA8FE" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="810" y1="215" x2="870" y2="215" stroke="#6EA8FE" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="995" y1="260" x2="995" y2="330" stroke="#49D18B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="995" y1="260" x2="995" y2="500" stroke="#E07070" stroke-width="2" stroke-dasharray="6 8" marker-end="url(#arrow)"/>
  <line x1="870" y1="375" x2="790" y2="375" stroke="#D6D66E" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="665" y1="420" x2="665" y2="500" stroke="#6EA8FE" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
