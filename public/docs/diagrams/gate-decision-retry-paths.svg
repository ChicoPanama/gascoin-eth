<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" fill="none">
  <rect width="1200" height="620" fill="#0B0D12"/>
  <text x="60" y="64" fill="#EAF2FF" font-family="Inter, Arial" font-size="34" font-weight="700">Gate Decision & Retry Paths</text>
  <text x="60" y="96" fill="#9FB3D9" font-family="Inter, Arial" font-size="18">Blocking gates (1-9) and non-blocking treasury queue (10)</text>

  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6EA8FE"/></marker></defs>

  <g font-family="Inter, Arial" font-size="16" fill="#EAF2FF">
    <rect x="80" y="170" width="220" height="90" rx="12" fill="#132238" stroke="#2A4A73"/>
    <text x="130" y="205">Submission Created</text>
    <text x="105" y="232" fill="#A8C1E8">Initial validation complete</text>

    <rect x="360" y="170" width="240" height="90" rx="12" fill="#132238" stroke="#2A4A73"/>
    <text x="392" y="205">Run Gates 1 → 9</text>
    <text x="388" y="232" fill="#A8C1E8">Blocking fraud controls</text>

    <rect x="680" y="170" width="210" height="90" rx="12" fill="#133126" stroke="#2F7A58"/>
    <text x="727" y="205">Gate 10 Check</text>
    <text x="712" y="232" fill="#AEE8C5">Treasury solvency</text>

    <rect x="960" y="150" width="180" height="80" rx="12" fill="#133126" stroke="#2F7A58"/>
    <text x="1013" y="182">Approved</text>
    <text x="989" y="207" fill="#AEE8C5">Dispatch payout</text>

    <rect x="960" y="300" width="180" height="90" rx="12" fill="#2A2D12" stroke="#7A7A2F"/>
    <text x="1000" y="336">Queue</text>
    <text x="978" y="362" fill="#E4E4A8">Retry every 6h</text>

    <rect x="960" y="470" width="180" height="90" rx="12" fill="#3A2626" stroke="#9E5252"/>
    <text x="1013" y="506">Rejected</text>
    <text x="986" y="532" fill="#F4B3B3">Fix + resubmit</text>

    <rect x="360" y="470" width="380" height="90" rx="12" fill="#1B1E2C" stroke="#3A4470"/>
    <text x="400" y="505">Audit trail writes on every state transition</text>
    <text x="400" y="530" fill="#A8C1E8">submitted → auto_review → approved/queue/rejected</text>
  </g>

  <line x1="300" y1="215" x2="360" y2="215" stroke="#6EA8FE" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="215" x2="680" y2="215" stroke="#6EA8FE" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="890" y1="195" x2="960" y2="190" stroke="#49D18B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="785" y1="260" x2="960" y2="340" stroke="#D6D66E" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="480" y1="260" x2="960" y2="515" stroke="#E07070" stroke-width="2" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <line x1="1050" y1="390" x2="1050" y2="470" stroke="#D6D66E" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="470" x2="560" y2="560" stroke="#6EA8FE" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
