<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none">
  <rect width="1200" height="560" fill="#0B0D12"/>
  <text x="60" y="64" fill="#EAF2FF" font-family="Inter, Arial" font-size="34" font-weight="700">Receipt Intelligence Pipeline</text>
  <text x="60" y="96" fill="#9FB3D9" font-family="Inter, Arial" font-size="18">How receipt images become policy decisions</text>

  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6EA8FE"/></marker></defs>

  <g font-family="Inter, Arial" font-size="15" fill="#EAF2FF">
    <rect x="60" y="170" width="180" height="100" rx="12" fill="#132238" stroke="#2A4A73"/>
    <text x="84" y="210">Upload Intake</text><text x="84" y="236" fill="#A8C1E8">Type/size checks</text>

    <rect x="280" y="170" width="180" height="100" rx="12" fill="#132238" stroke="#2A4A73"/>
    <text x="314" y="210">OCR Parse</text><text x="302" y="236" fill="#A8C1E8">Date/Amount/Wallet</text>

    <rect x="500" y="170" width="180" height="100" rx="12" fill="#132238" stroke="#2A4A73"/>
    <text x="526" y="210">Image Integrity</text><text x="526" y="236" fill="#A8C1E8">AI + tamper score</text>

    <rect x="720" y="170" width="180" height="100" rx="12" fill="#132238" stroke="#2A4A73"/>
    <text x="752" y="210">pHash/Fingerprint</text><text x="752" y="236" fill="#A8C1E8">Duplicate checks</text>

    <rect x="940" y="170" width="200" height="100" rx="12" fill="#133126" stroke="#2F7A58"/>
    <text x="970" y="210">Gate Inputs</text><text x="970" y="236" fill="#AEE8C5">Policy-ready signals</text>

    <rect x="390" y="360" width="420" height="120" rx="12" fill="#1B1E2C" stroke="#3A4470"/>
    <text x="420" y="400">Outputs persisted for explainability</text>
    <text x="420" y="430" fill="#A8C1E8">• OCR confidence</text>
    <text x="620" y="430" fill="#A8C1E8">• AI/tamper scores</text>
    <text x="420" y="456" fill="#A8C1E8">• Duplicate flags</text>
    <text x="620" y="456" fill="#A8C1E8">• Receipt metadata</text>
  </g>

  <line x1="240" y1="220" x2="280" y2="220" stroke="#6EA8FE" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="460" y1="220" x2="500" y2="220" stroke="#6EA8FE" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="680" y1="220" x2="720" y2="220" stroke="#6EA8FE" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="220" x2="940" y2="220" stroke="#6EA8FE" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1040" y1="270" x2="810" y2="360" stroke="#49D18B" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
