name: Scoped security lock audit probe

on:
  push:
    branches: [ux-lab]
    paths:
      - '.github/workflows/security-audit-lock-probe.yml'

permissions:
  contents: read

jobs:
  audit:
    name: ${{ matrix.strategy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        strategy: [exact-solana-parent, update-solana-parent, latest-solana-parent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply proven parent-level fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies.ws = '8.21.3';
          p.overrides = {
            ...(p.overrides || {}),
            '@coinbase/cdp-sdk': {
              ...((p.overrides || {})['@coinbase/cdp-sdk'] || {}),
              axios: '1.18.0'
            },
            'styled-components': '6.5.3',
            '@walletconnect/utils': '2.22.4',
            '@walletconnect/jsonrpc-ws-connection': {
              ...((p.overrides || {})['@walletconnect/jsonrpc-ws-connection'] || {}),
              ws: '7.5.13'
            }
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Patch exact Solana websocket parent
        if: matrix.strategy == 'exact-solana-parent'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.overrides['@solana/rpc-subscriptions-channel-websocket@5.5.1'] = { ws: '8.21.3' };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Update Solana websocket parent within declared ranges
        if: matrix.strategy == 'update-solana-parent'
        run: npm update @solana/rpc-subscriptions-channel-websocket --package-lock-only --ignore-scripts

      - name: Test latest Solana websocket parent override
        if: matrix.strategy == 'latest-solana-parent'
        shell: bash
        run: |
          LATEST=$(npm view @solana/rpc-subscriptions-channel-websocket version)
          echo "LATEST_SOLANA_WS_PARENT=$LATEST"
          node - "$LATEST" <<'NODE'
          const fs = require('fs');
          const latest = process.argv[2];
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.overrides['@solana/rpc-subscriptions-channel-websocket'] = latest;
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Audit production lock graph
        shell: bash
        run: |
          npm audit --omit=dev --package-lock-only --json > /tmp/audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const meta = audit.metadata?.vulnerabilities || {};
          const blockers = Object.entries(audit.vulnerabilities || {})
            .filter(([, v]) => v.severity === 'high' || v.severity === 'critical')
            .map(([name, v]) => ({ name, severity: v.severity, range: v.range, nodes: v.nodes, effects: v.effects, fixAvailable: v.fixAvailable }));
          console.log('AUDIT_METADATA=' + JSON.stringify(meta));
          console.log('HIGH_CRITICAL=' + JSON.stringify(blockers));
          if (blockers.length) process.exit(2);
          NODE

      - name: Show final ownership
        if: always()
        run: npm ls @solana/rpc-subscriptions-channel-websocket @walletconnect/utils ws viem isows --all || true
