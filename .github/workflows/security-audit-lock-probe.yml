name: Privy Node dependency security probe

on:
  push:
    branches: [ux-lab]
    paths:
      - '.github/workflows/security-audit-lock-probe.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find nearest Privy Node releases and Solana dependencies
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require('child_process');
          const versions = JSON.parse(execFileSync('npm', ['view','@privy-io/node','versions','--json'], {encoding:'utf8'}));
          const candidates = versions.filter(v => {
            const m = v.match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!m) return false;
            const [maj,min] = [Number(m[1]),Number(m[2])];
            return maj === 0 && min >= 12;
          }).slice(-30);
          console.log('CANDIDATES=' + JSON.stringify(candidates));
          for (const v of candidates) {
            let raw;
            try {
              raw = execFileSync('npm', ['view',`@privy-io/node@${v}`,'version','dependencies','peerDependencies','engines','--json'], {encoding:'utf8'});
            } catch (e) {
              console.log('ERROR ' + v + ' ' + e.message);
              continue;
            }
            const data = JSON.parse(raw);
            const deps = data.dependencies || {};
            const solana = Object.fromEntries(Object.entries(deps).filter(([k]) => k.startsWith('@solana/')));
            console.log(JSON.stringify({version:v, solana, engines:data.engines, viem:deps.viem, axios:deps.axios}));
          }
          NODE
