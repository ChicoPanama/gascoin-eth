name: Finalize hardened production dependency graph

on:
  push:
    branches: [ux-lab]
    paths:
      - '.github/workflows/security-audit-lock-probe.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-lab
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate proven hardened graph
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies.ws = '8.21.3';
          p.overrides = {
            '@coinbase/cdp-sdk': { axios: '1.18.0' },
            'styled-components': '6.5.3',
            '@walletconnect/utils': '2.22.4',
            '@walletconnect/jsonrpc-ws-connection': { ws: '7.5.13' }
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm update ws --package-lock-only --ignore-scripts
          npm dedupe --package-lock-only --ignore-scripts

          node <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const parentKey = 'node_modules/@solana/rpc-subscriptions-channel-websocket';
          const staleKey = parentKey + '/node_modules/ws';
          const parent = lock.packages?.[parentKey];
          const rootWs = lock.packages?.['node_modules/ws'];
          if (parent?.version !== '5.5.1') throw new Error(`Unexpected Solana websocket parent: ${parent?.version}`);
          if (parent?.dependencies?.ws !== '^8.19.0') throw new Error(`Unexpected Solana ws range: ${parent?.dependencies?.ws}`);
          if (rootWs?.version !== '8.21.3') throw new Error(`Expected root ws@8.21.3, got ${rootWs?.version}`);
          if (lock.packages[staleKey]) delete lock.packages[staleKey];
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE

      - name: Verify install and production security
        shell: bash
        run: |
          rm -rf node_modules
          npm ci
          npm audit --omit=dev --json > /tmp/audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const meta = audit.metadata?.vulnerabilities || {};
          const blockers = Object.entries(audit.vulnerabilities || {})
            .filter(([, v]) => v.severity === 'high' || v.severity === 'critical')
            .map(([name, v]) => ({ name, severity: v.severity, range: v.range, nodes: v.nodes }));
          console.log('AUDIT_METADATA=' + JSON.stringify(meta));
          console.log('HIGH_CRITICAL=' + JSON.stringify(blockers));
          if (blockers.length) process.exit(2);
          NODE

      - name: Commit and push without overwriting concurrent work
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency graph already promoted.'
            exit 0
          fi
          git commit -m 'chore: harden production dependency graph'

          # npm/Next tooling may leave tracked build-generated changes; discard only
          # those post-commit working-tree changes while preserving the dependency commit.
          git reset --hard HEAD
          git clean -fd

          for attempt in 1 2 3; do
            git fetch origin ux-lab
            git rebase origin/ux-lab
            if git push origin HEAD:ux-lab; then
              echo "Promoted on attempt ${attempt}."
              exit 0
            fi
            echo "Push raced with another ux-lab update; retrying (${attempt}/3)."
          done
          echo 'Unable to promote without overwriting newer ux-lab work.' >&2
          exit 1
