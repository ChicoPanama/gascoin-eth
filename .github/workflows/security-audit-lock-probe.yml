name: Solana 5.x security compatibility probe

on:
  push:
    branches: [ux-lab]
    paths:
      - '.github/workflows/security-audit-lock-probe.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Privy dependency and compatible Solana 5.x releases
        shell: bash
        run: |
          echo 'PRIVY_0_12_DEPENDENCIES'
          npm view @privy-io/node@0.12.0 dependencies --json
          node <<'NODE'
          const { execFileSync } = require('child_process');
          const versions = JSON.parse(execFileSync('npm',['view','@solana/kit','versions','--json'],{encoding:'utf8'}));
          const stable5 = versions.filter(v => /^5\.\d+\.\d+$/.test(v));
          console.log('SOLANA_5X=' + JSON.stringify(stable5));
          for (const v of stable5) {
            let ws = null;
            let subs = null;
            try { ws = execFileSync('npm',['view',`@solana/rpc-subscriptions-channel-websocket@${v}`,'dependencies.ws'],{encoding:'utf8'}).trim(); } catch {}
            try { subs = execFileSync('npm',['view',`@solana/kit@${v}`,'dependencies.@solana/rpc-subscriptions'],{encoding:'utf8'}).trim(); } catch {}
            console.log(JSON.stringify({version:v, channelWs:ws, kitSubscriptions:subs}));
          }
          NODE
