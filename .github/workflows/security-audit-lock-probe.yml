name: Scoped security lock audit probe

on:
  push:
    branches: [ux-lab]
    paths:
      - '.github/workflows/security-audit-lock-probe.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show constrained package contracts
        shell: bash
        run: |
          echo 'SOLANA_CHANNEL_5_5_1'
          npm view @solana/rpc-subscriptions-channel-websocket@5.5.1 version dependencies peerDependencies peerDependenciesMeta engines --json
          echo 'SOLANA_SUBSCRIPTIONS_5_5_1'
          npm view @solana/rpc-subscriptions@5.5.1 version dependencies peerDependencies engines --json
          echo 'SOLANA_KIT_5_5_1'
          npm view @solana/kit@5.5.1 version dependencies peerDependencies engines --json
          echo 'SUPABASE_REALTIME_2_101_1'
          npm view @supabase/realtime-js@2.101.1 version dependencies peerDependencies engines --json
