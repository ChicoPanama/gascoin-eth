name: Normalized lock security probe

on:
  push:
    branches: [ux-lab]
    paths:
      - '.github/workflows/security-audit-lock-probe.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build normalized candidate lock
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.dependencies.ws = '8.21.3';
          p.overrides = {
            '@coinbase/cdp-sdk': { axios: '1.18.0' },
            'styled-components': '6.5.3',
            '@walletconnect/utils': '2.22.4',
            '@walletconnect/jsonrpc-ws-connection': { ws: '7.5.13' }
          };
          fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm update ws --package-lock-only --ignore-scripts
          npm dedupe --package-lock-only --ignore-scripts
          node <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const parentKey = 'node_modules/@solana/rpc-subscriptions-channel-websocket';
          const staleKey = parentKey + '/node_modules/ws';
          const parent = lock.packages[parentKey];
          const rootWs = lock.packages['node_modules/ws'];
          if (parent?.version !== '5.5.1' || parent?.dependencies?.ws !== '^8.19.0' || rootWs?.version !== '8.21.3') {
            throw new Error('Lock assumptions changed');
          }
          console.log('STALE_SOLANA_WS=' + JSON.stringify(lock.packages[staleKey]?.version || null));
          delete lock.packages[staleKey];
          fs.writeFileSync('package-lock.json', JSON.stringify(lock,null,2)+'\n');
          NODE
      - name: Audit normalized production lock
        shell: bash
        run: |
          npm audit --omit=dev --package-lock-only --json > /tmp/audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const meta = a.metadata?.vulnerabilities || {};
          const blockers = Object.entries(a.vulnerabilities || {}).filter(([,v]) => ['high','critical'].includes(v.severity)).map(([name,v]) => ({name,severity:v.severity,nodes:v.nodes,range:v.range}));
          console.log('AUDIT_METADATA=' + JSON.stringify(meta));
          console.log('HIGH_CRITICAL=' + JSON.stringify(blockers));
          if (blockers.length) process.exit(2);
          NODE
