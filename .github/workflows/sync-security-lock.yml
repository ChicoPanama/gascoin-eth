name: Sync security dependency lock

on:
  push:
    branches: [ux-lab]
    paths:
      - '.github/workflows/sync-security-lock.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-lab
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile from pinned manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate install graph
        run: npm ci --ignore-scripts
      - name: Measure production audit
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/prod-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/prod-audit.json', 'utf8'));
          const summary = audit.metadata?.vulnerabilities || {};
          const blockers = Object.entries(audit.vulnerabilities || {})
            .filter(([, value]) => value.severity === 'high' || value.severity === 'critical')
            .map(([name, value]) => ({
              name,
              severity: value.severity,
              isDirect: value.isDirect,
              range: value.range,
              fixAvailable: value.fixAvailable,
              effects: value.effects,
            }));
          console.log('PROD_AUDIT_SUMMARY=' + JSON.stringify(summary));
          console.log('PROD_AUDIT_BLOCKERS=' + JSON.stringify(blockers));
          NODE
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: synchronize security dependency lock'
          git pull --rebase origin ux-lab
          git push origin HEAD:ux-lab
