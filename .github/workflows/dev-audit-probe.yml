name: Finalize zero-high full dependency graph

on:
  push:
    branches: [ux-lab]
    paths:
      - '.github/workflows/dev-audit-probe.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-lab
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate certified non-forced remediation
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          rm -rf node_modules
          npm ci

      - name: Full high-critical security gate
        shell: bash
        run: |
          npm audit --json > /tmp/full-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/full-audit.json', 'utf8'));
          const blockers = Object.entries(audit.vulnerabilities || {})
            .filter(([,v]) => v.severity === 'high' || v.severity === 'critical')
            .map(([name,v]) => ({name,severity:v.severity,range:v.range,nodes:v.nodes}));
          console.log('FULL_AUDIT_METADATA=' + JSON.stringify(audit.metadata?.vulnerabilities || {}));
          console.log('HIGH_CRITICAL=' + JSON.stringify(blockers));
          if (blockers.length) process.exit(2);
          NODE

      - name: Production regression gate
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/prod-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/prod-audit.json', 'utf8'));
          const blockers = Object.entries(audit.vulnerabilities || {})
            .filter(([,v]) => v.severity === 'high' || v.severity === 'critical');
          console.log('PROD_AUDIT_METADATA=' + JSON.stringify(audit.metadata?.vulnerabilities || {}));
          if (blockers.length) process.exit(3);
          NODE

      - name: Commit remediated lockfile safely
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already remediated.'
            exit 0
          fi
          git commit -m 'chore: clear remaining dependency high advisories'
          git reset --hard HEAD
          git clean -fd

          for attempt in 1 2 3; do
            git fetch origin ux-lab
            git rebase origin/ux-lab
            if git push origin HEAD:ux-lab; then
              echo "Promoted on attempt ${attempt}."
              exit 0
            fi
            echo "Push raced with another ux-lab update; retrying (${attempt}/3)."
          done
          echo 'Unable to promote without overwriting newer ux-lab work.' >&2
          exit 1
