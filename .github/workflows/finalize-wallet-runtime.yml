name: Finalize wallet runtime

on:
  push:
    branches: [ux-lab]
    paths:
      - '.github/workflows/finalize-wallet-runtime.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-lab
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Stripe runtime peer required by Privy onramp bundle
        run: npm install --save-exact @stripe/stripe-js
      - name: Production dependency audit summary
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/prod-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/prod-audit.json', 'utf8'));
          console.log('PROD_AUDIT_SUMMARY=' + JSON.stringify(data.metadata?.vulnerabilities || {}));
          NODE
      - name: Wallet transitive ownership snapshot
        shell: bash
        run: |
          npm ls @metamask/sdk @walletconnect/sign-client @walletconnect/universal-provider @safe-global/safe-gateway-typescript-sdk --all || true
      - name: Commit runtime dependency files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Runtime dependencies already synchronized.'
            exit 0
          fi
          git commit -m 'chore: finalize wallet runtime dependencies'
          git push origin HEAD:ux-lab
