name: Production dependency audit diagnostic

on:
  push:
    branches: [ux-lab]
    paths:
      - '.github/workflows/security-audit-diagnostic.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify clean baseline
        run: npm ci

      - name: Apply scoped security overrides in runner only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.overrides = {
            ...(p.overrides || {}),
            '@coinbase/cdp-sdk': {
              ...((p.overrides || {})['@coinbase/cdp-sdk'] || {}),
              axios: '1.18.0'
            },
            'styled-components': {
              ...((p.overrides || {})['styled-components'] || {}),
              postcss: '8.5.23'
            },
            viem: {
              ...((p.overrides || {}).viem || {}),
              ws: '8.21.3'
            },
            '@vercel/functions': {
              ...((p.overrides || {})['@vercel/functions'] || {}),
              ws: '8.21.3'
            }
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Verify reproducible overridden graph
        shell: bash
        run: |
          rm -rf node_modules
          npm ci

      - name: Production audit after scoped remediation
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const meta = audit.metadata?.vulnerabilities || {};
          console.log('AUDIT_METADATA=' + JSON.stringify(meta));
          const rows = Object.entries(audit.vulnerabilities || {})
            .map(([name, v]) => ({ name, ...v }))
            .sort((a,b) => ({critical:5,high:4,moderate:3,low:2,info:1}[b.severity]||0)-({critical:5,high:4,moderate:3,low:2,info:1}[a.severity]||0) || a.name.localeCompare(b.name));
          for (const v of rows) {
            console.log('\n=== VULNERABILITY ' + v.name + ' ===');
            console.log(JSON.stringify({severity:v.severity,isDirect:v.isDirect,range:v.range,effects:v.effects,fixAvailable:v.fixAvailable,via:v.via}, null, 2));
          }
          const blockers = rows.filter(v => v.severity === 'high' || v.severity === 'critical').map(v => v.name);
          console.log('\nHIGH_CRITICAL_PACKAGES=' + JSON.stringify(blockers));
          if (blockers.length) process.exitCode = 2;
          NODE

      - name: Verify dependency ownership
        if: always()
        run: |
          npm ls next sharp @sentry/nextjs @privy-io/react-auth x402 @walletconnect/ethereum-provider ws axios postcss nanoid brace-expansion --all || true

      - name: Unit tests
        if: always()
        run: npm test

      - name: TypeScript check
        if: always()
        run: npx tsc --noEmit

      - name: Upload scoped candidate manifest and lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-security-scoped-candidate
          path: |
            package.json
            package-lock.json
          retention-days: 1
