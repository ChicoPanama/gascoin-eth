name: Semver-safe production security remediation

on:
  push:
    branches: [ux-lab]
    paths:
      - '.github/workflows/semver-security-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-lab
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Synchronize manifest and lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact graph
        run: npm ci
      - name: Apply only semver-safe production audit fixes
        shell: bash
        run: |
          set +e
          npm audit fix --omit=dev
          status=$?
          set -e
          echo "npm audit fix exit=$status; continuing because unresolved advisories are measured and gated separately"
      - name: Revalidate clean install from remediated lockfile
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Measure production advisory result
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const counts = a.metadata?.vulnerabilities || {};
          console.log('PRODUCTION_AUDIT=' + JSON.stringify(counts));
          const vulns = a.vulnerabilities || {};
          const highs = Object.entries(vulns)
            .filter(([,v]) => v.severity === 'high' || v.severity === 'critical')
            .map(([name,v]) => ({name,severity:v.severity,isDirect:v.isDirect,range:v.range,effects:v.effects,fixAvailable:v.fixAvailable}));
          console.log('HIGH_CRITICAL=' + JSON.stringify(highs));
          NODE
      - name: Commit validated remediation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No remediation changes to commit.'
            exit 0
          fi
          git commit -m 'chore: apply semver-safe production security fixes'
          git pull --rebase origin ux-lab
          git push origin HEAD:ux-lab
