name: Zero-high dependency candidate matrix

on:
  push:
    branches: [ux-lab]
    paths:
      - '.github/workflows/security-candidate-matrix.yml'

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
  NEXT_PUBLIC_GASCOIN_MINT_ADDRESS: placeholder
  GASCOIN_TREASURY_WALLET: placeholder
  ADMIN_WALLET_ADDRESSES: placeholder
  ADMIN_SESSION_SECRET: placeholder_32_chars_minimum_length
  X_BEARER_TOKEN: placeholder
  X_API_BEARER_TOKEN: placeholder

jobs:
  candidate:
    name: zero-high-scoped-with-ws-peer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify clean baseline
        run: npm ci

      - name: Snapshot baseline dependency problems
        shell: bash
        run: npm ls --all --json > /tmp/baseline-ls.json || true

      - name: Apply proven zero-high remediation plus ws peer in runner only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies.ws = '8.21.3';
          p.overrides = {
            ...(p.overrides || {}),
            '@coinbase/cdp-sdk': {
              ...((p.overrides || {})['@coinbase/cdp-sdk'] || {}),
              axios: '1.18.0'
            },
            'styled-components': '6.5.3',
            '@solana/rpc-subscriptions-channel-websocket': {
              ...((p.overrides || {})['@solana/rpc-subscriptions-channel-websocket'] || {}),
              ws: '8.21.3'
            },
            '@supabase/realtime-js': {
              ...((p.overrides || {})['@supabase/realtime-js'] || {}),
              ws: '8.21.3'
            },
            '@walletconnect/jsonrpc-ws-connection': {
              ...((p.overrides || {})['@walletconnect/jsonrpc-ws-connection'] || {}),
              ws: '7.5.13'
            },
            viem: {
              ...((p.overrides || {}).viem || {}),
              ws: '8.21.3'
            }
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Verify reproducible clean install
        shell: bash
        run: |
          rm -rf node_modules
          npm ci

      - name: Reject newly introduced dependency-tree problems
        shell: bash
        run: |
          npm ls --all --json > /tmp/candidate-ls.json || true
          node <<'NODE'
          const fs = require('fs');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const baseline = new Set(read('/tmp/baseline-ls.json').problems || []);
          const candidate = read('/tmp/candidate-ls.json').problems || [];
          const added = candidate.filter((p) => !baseline.has(p));
          const removed = [...baseline].filter((p) => !candidate.includes(p));
          fs.writeFileSync('/tmp/new-problems.json', JSON.stringify({ added, removed }, null, 2));
          console.log('BASELINE_PROBLEMS=' + JSON.stringify([...baseline]));
          console.log('CANDIDATE_PROBLEMS=' + JSON.stringify(candidate));
          console.log('NEW_PROBLEMS=' + JSON.stringify(added));
          console.log('REMOVED_PROBLEMS=' + JSON.stringify(removed));
          if (added.length) process.exit(3);
          NODE

      - name: Production audit gate
        if: always()
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const meta = audit.metadata?.vulnerabilities || {};
          const blockers = Object.entries(audit.vulnerabilities || {})
            .filter(([, v]) => v.severity === 'high' || v.severity === 'critical')
            .map(([name, v]) => ({ name, severity: v.severity, range: v.range, effects: v.effects, fixAvailable: v.fixAvailable }));
          console.log('AUDIT_METADATA=' + JSON.stringify(meta));
          console.log('HIGH_CRITICAL=' + JSON.stringify(blockers));
          if (blockers.length) process.exit(2);
          NODE

      - name: Security ownership snapshot
        if: always()
        run: npm ls @privy-io/node @privy-io/react-auth @vercel/functions @supabase/supabase-js @supabase/realtime-js styled-components postcss ws axios viem @solana/rpc-subscriptions-channel-websocket @walletconnect/jsonrpc-ws-connection --all || true

      - name: Unit tests
        if: always()
        run: npm test

      - name: TypeScript check
        if: always()
        run: npx tsc --noEmit

      - name: Production build
        if: always()
        run: npm run build

      - name: Upload candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-candidate-zero-high-scoped-with-ws-peer
          path: |
            package.json
            package-lock.json
            /tmp/audit.json
            /tmp/baseline-ls.json
            /tmp/candidate-ls.json
            /tmp/new-problems.json
          retention-days: 1
