name: Wallet Dependency Sync

on:
  push:
    branches: [ux-lab]
    paths:
      - '.github/workflows/wallet-deps-sync.yml'

permissions:
  contents: write

jobs:
  sync-wallet-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-lab
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Synchronize wallet dependencies
        run: |
          npm install --save-exact \
            @privy-io/react-auth@3.36.1 \
            @privy-io/wagmi@4.0.15 \
            wagmi@2.19.3 \
            @wagmi/core@2.22.1 \
            viem@2.55.8
      - name: Commit synchronized manifest and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Wallet dependency files already synchronized.'
            exit 0
          fi
          git commit -m 'chore: synchronize wallet dependency stack'
          git push origin HEAD:ux-lab
