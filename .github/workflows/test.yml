name: Project GAS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: project-gas-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
  NEXT_PUBLIC_GASCOIN_MINT_ADDRESS: placeholder
  GASCOIN_TREASURY_WALLET: placeholder
  ADMIN_WALLET_ADDRESSES: placeholder
  ADMIN_SESSION_SECRET: placeholder_32_chars_minimum_length
  X_BEARER_TOKEN: placeholder
  X_API_BEARER_TOKEN: placeholder

jobs:
  project-gas-contracts:
    name: Project GAS Contracts
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.5.0
          cache: false
      - name: Verify format
        working-directory: contracts/project-gas
        run: forge fmt --check
      - name: Build contracts
        working-directory: contracts/project-gas
        run: forge build --sizes
      - name: Run contract tests
        working-directory: contracts/project-gas
        run: forge test -vvv

  dependency-security:
    name: Full Dependency Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Block high and critical dependency advisories
        shell: bash
        run: |
          npm audit --json > /tmp/audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const meta = audit.metadata?.vulnerabilities || {};
          const blockers = Object.entries(audit.vulnerabilities || {})
            .filter(([, v]) => v.severity === 'high' || v.severity === 'critical')
            .map(([name, v]) => ({ name, severity: v.severity, range: v.range, nodes: v.nodes }));
          console.log('AUDIT_METADATA=' + JSON.stringify(meta));
          console.log('HIGH_CRITICAL=' + JSON.stringify(blockers));
          if (blockers.length) process.exit(2);
          NODE

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test

  build-check:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: next-production-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1

  project-gas-e2e:
    name: Project GAS E2E
    runs-on: ubuntu-latest
    needs: [dependency-security, unit-tests, build-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-production-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:gas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-project-gas
          path: playwright-report/
          retention-days: 14

  legacy-regression:
    name: Legacy Compatibility E2E
    runs-on: ubuntu-latest
    needs: [dependency-security, unit-tests, build-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-production-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:legacy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-legacy-compatibility
          path: playwright-report/
          retention-days: 14
